<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🥖 Tiệm Bánh Mì Của Bé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Nunito','Segoe UI',system-ui,sans-serif;
    background:#1a1a2e;user-select:none;touch-action:manipulation;
  }
  :root{
    --shopw:235px;
    --pink:#ff8fab;
    --cream:#fff8ee;
    --brown:#8b5e3c;
  }
  @media (max-width:700px){
    :root{--shopw:130px}
  }

  /* ================= INTRO ================= */
  #intro{
    position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#ffd6e8 0%,#ffe9c9 55%,#a8e6a3 100%);
    transition:opacity .7s ease, visibility .7s;
    overflow:hidden;text-align:center;padding:20px;
  }
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  .intro-cloud{
    position:absolute;background:#fff;border-radius:50%;opacity:.85;
    animation:drift linear infinite;
  }
  .intro-cloud::before,.intro-cloud::after{
    content:'';position:absolute;background:#fff;border-radius:50%;
  }
  .intro-cloud::before{width:55%;height:130%;top:-55%;left:12%}
  .intro-cloud::after{width:42%;height:100%;top:-38%;right:10%}
  .ic1{width:90px;height:30px;top:12%;animation-duration:38s;animation-delay:-5s}
  .ic2{width:120px;height:38px;top:26%;animation-duration:52s;animation-delay:-20s;opacity:.6}
  .ic3{width:70px;height:24px;top:6%;animation-duration:44s;animation-delay:-32s;opacity:.75}
  @keyframes drift{
    from{transform:translateX(110vw)}
    to{transform:translateX(-160px)}
  }
  #intro h1{
    font-size:clamp(26px,7vw,52px);font-weight:900;color:#e05780;
    text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(224,87,128,.25);
    margin-bottom:6px;line-height:1.25;position:relative;z-index:2;
    animation:bob 2.4s ease-in-out infinite;
  }
  #intro h2{
    font-size:clamp(13px,3.4vw,18px);color:#a9713f;font-weight:700;
    margin-bottom:22px;position:relative;z-index:2;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #introEmoji{
    font-size:clamp(50px,14vw,86px);margin-bottom:8px;position:relative;z-index:2;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));
    animation:bob 1.8s ease-in-out infinite;
  }
  #btnStart{
    position:relative;z-index:2;
    font-family:inherit;font-size:clamp(17px,4.4vw,24px);font-weight:900;color:#fff;
    background:linear-gradient(180deg,#ff9ec4,#ff5f92);
    border:none;border-radius:999px;padding:16px 44px;cursor:pointer;
    box-shadow:0 7px 0 #d63e70, 0 12px 24px rgba(214,62,112,.4);
    transition:transform .12s, box-shadow .12s;
    animation:pulse 1.6s ease-in-out infinite;
  }
  #btnStart:active{transform:translateY(5px);box-shadow:0 2px 0 #d63e70}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .intro-hint{
    margin-top:18px;font-size:clamp(11px,3vw,14px);color:#a9713f;font-weight:700;
    position:relative;z-index:2;opacity:.9;
  }

  /* ================= GAME ================= */
  #game{
    position:fixed;inset:0;display:flex;flex-direction:column;
    opacity:0;transition:opacity .6s ease .2s;
  }
  #game.show{opacity:1}

  /* ----- HUD ----- */
  #hud{
    height:54px;flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:0 10px;background:linear-gradient(180deg,#fff8ee,#ffeeda);
    border-bottom:4px solid #ffc98b;box-shadow:0 3px 10px rgba(0,0,0,.08);
    z-index:20;
  }
  .hud-item{
    display:flex;align-items:center;gap:5px;background:#fff;
    border:2px solid #ffd6a5;border-radius:999px;padding:5px 12px;
    font-size:14px;font-weight:900;color:#8b5e3c;white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
  }
  .hud-item.money{color:#2e8b57}
  .hud-item.rep{color:#e0a800}
  #btnMusic{
    margin-left:auto;width:40px;height:40px;border-radius:50%;border:2px solid #ffd6a5;
    background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.08);transition:transform .12s;
  }
  #btnMusic:active{transform:scale(.92)}

  /* ----- SCENE ----- */
  #scene{position:relative;flex:1 1 auto;overflow:hidden;min-height:0}
  #sky{position:absolute;inset:0;transition:background .8s linear}
  #sun{
    position:absolute;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff9c4,#ffd93d 60%,#ffb300);
    box-shadow:0 0 40px 14px rgba(255,217,61,.55);
    transition:left .9s linear, top .9s linear;
  }
  .cloud{
    position:absolute;background:#fff;border-radius:50%;opacity:.92;
    animation:drift linear infinite;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
  }
  .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:135%;top:-60%;left:12%}
  .cloud::after{width:42%;height:105%;top:-42%;right:10%}
  .c1{width:80px;height:26px;top:9%;animation-duration:46s;animation-delay:-6s}
  .c2{width:110px;height:34px;top:24%;animation-duration:62s;animation-delay:-28s;opacity:.7}
  .c3{width:64px;height:22px;top:4%;animation-duration:38s;animation-delay:-18s;opacity:.8}
  .c4{width:95px;height:30px;top:38%;animation-duration:74s;animation-delay:-50s;opacity:.55}

  #hills{
    position:absolute;left:0;right:0;bottom:78px;height:90px;
    background:radial-gradient(ellipse 60% 100% at 20% 100%,#a8d98a 0 70%,transparent 71%),
               radial-gradient(ellipse 55% 100% at 62% 100%,#98d47c 0 70%,transparent 71%),
               radial-gradient(ellipse 50% 100% at 95% 100%,#a8d98a 0 70%,transparent 71%);
    opacity:.85;
  }
  #ground{
    position:absolute;left:0;right:0;bottom:0;height:88px;
    background:linear-gradient(180deg,#9be36d,#5fb832);
    border-top:4px solid #b6ed8a;
  }
  #ground::after{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(circle,rgba(255,255,255,.25) 1.5px,transparent 1.6px);
    background-size:26px 20px;opacity:.5;
  }

  /* ----- SHOP ----- */
  #shop{position:absolute;left:0;bottom:0;width:var(--shopw);height:215px;z-index:8}
  @media (max-width:700px){#shop{height:170px}}
  .shop-roof{
    position:absolute;top:0;left:0;right:0;height:44px;border-radius:14px 14px 8px 8px;
    background:repeating-linear-gradient(90deg,#ff8fab 0 20px,#fff6ea 20px 40px);
    box-shadow:0 5px 0 rgba(0,0,0,.10),inset 0 -6px 0 rgba(0,0,0,.06);
    border:3px solid #e05780;
  }
  .shop-sign{
    position:absolute;top:50px;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,#ffe08a,#ffc93c);
    border:3px solid #b8860b;border-radius:12px;padding:3px 12px;
    font-weight:900;font-size:13px;color:#7a4b00;white-space:nowrap;
    box-shadow:0 3px 0 rgba(0,0,0,.14);z-index:3;
  }
  @media (max-width:700px){.shop-sign{font-size:10px;padding:2px 8px;top:42px}}
  .shop-body{
    position:absolute;bottom:0;left:6px;right:6px;top:88px;
    background:linear-gradient(180deg,#d99a5f,#b0733c);
    border-radius:12px 12px 0 0;border:3px solid #8b5e3c;border-bottom:none;
    box-shadow:inset 0 6px 0 rgba(255,255,255,.22);
  }
  .shop-counter{
    position:absolute;bottom:0;left:-6px;right:-6px;height:52px;
    background:linear-gradient(180deg,#f0c088,#cf9a5f);
    border-radius:10px 10px 0 0;border:3px solid #8b5e3c;border-bottom:none;
    box-shadow:inset 0 5px 0 rgba(255,255,255,.3);
  }
  .shop-food{
    position:absolute;bottom:46px;left:0;right:0;text-align:center;
    font-size:20px;letter-spacing:3px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
  }
  @media (max-width:700px){.shop-food{font-size:14px;bottom:38px}}

  /* ----- TREES ----- */
  .tree{position:absolute;bottom:60px;z-index:6;transform-origin:bottom center}
  .tree .trunk{width:12px;height:52px;background:linear-gradient(90deg,#a9713f,#8b5e3c);border-radius:4px;margin:0 auto}
  .tree .leaf{
    width:86px;height:86px;border-radius:50%;margin-bottom:-18px;
    background:radial-gradient(circle at 34% 28%,#8fe36b,#4caf50 70%,#3d8b40);
    box-shadow:inset -8px -8px 0 rgba(0,0,0,.08),0 6px 10px rgba(0,0,0,.12);
    position:relative;
  }
  .tree .leaf::after{
    content:'';position:absolute;width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#a5ee8a,#6cc24a);
    top:8px;left:8px;opacity:.9;
  }
  .tree.t1{right:10px;transform:scale(.95)}
  .tree.t2{right:110px;bottom:44px;transform:scale(.68);z-index:5}
  @media (max-width:700px){.tree.t2{display:none}.tree.t1{transform:scale(.7)}}

  .bush{
    position:absolute;bottom:56px;width:60px;height:38px;border-radius:50% 50% 40% 40%;
    background:radial-gradient(circle at 35% 30%,#8fe36b,#4caf50);
    z-index:6;
  }
  @media (max-width:700px){.bush{display:none}}

  /* ----- QUEUE ----- */
  #queue{
    position:absolute;left:var(--shopw);right:6px;bottom:4px;
    display:flex;align-items:flex-end;gap:2px;z-index:12;
    pointer-events:none;
  }
  .customer{
    width:74px;flex:0 0 auto;position:relative;cursor:pointer;pointer-events:auto;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .45s;
    transform:translateY(26px) scale(.85);opacity:0;
    transform-origin:bottom center;
  }
  @media (max-width:700px){.customer{width:56px}}
  .customer.in{transform:translateY(0) scale(1);opacity:1}
  .customer.in:hover{transform:translateY(-7px) scale(1.06)}
  .customer.out{transform:translateY(-30px) scale(.6);opacity:0}
  .customer svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.18))}
  .bubble{
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    background:#fff;border:2px solid #ffb3c6;border-radius:12px;
    padding:2px 7px;font-size:11px;font-weight:900;color:#e05780;
    white-space:nowrap;box-shadow:0 3px 6px rgba(0,0,0,.14);z-index:2;
    animation:bob 2s ease-in-out infinite;
  }
  @media (max-width:700px){.bubble{font-size:9px;padding:1px 5px;top:-22px}}
  .bubble::after{
    content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#ffb3c6;
  }
  .bubble::before{
    content:'';position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
    border:4px solid transparent;border-top-color:#fff;z-index:2;
  }

  /* ----- BOTTOM BAR ----- */
  #bottom{
    flex:0 0 auto;background:linear-gradient(180deg,#fff8ee,#ffe9d1);
    border-top:4px solid #ffc98b;padding:8px 10px 10px;
    display:flex;flex-direction:column;gap:8px;z-index:20;
    box-shadow:0 -3px 12px rgba(0,0,0,.08);
  }
  #tray{
    display:flex;gap:6px;flex-wrap:wrap;min-height:34px;align-items:center;
  }
  .chip{
    background:#fff;border:2px solid #ffd6a5;border-radius:999px;
    padding:4px 11px;font-size:13px;font-weight:900;color:#8b5e3c;
    display:flex;align-items:center;gap:5px;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
    animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .tray-empty{font-size:13px;font-weight:700;color:#c9a17a;font-style:italic}
  #actions{display:flex;gap:10px}
  .btn{
    flex:1;border:none;border-radius:16px;padding:11px 8px;font-family:inherit;
    font-size:15px;font-weight:900;color:#fff;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.18);
    transition:transform .1s,box-shadow .1s;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .btn.market{background:linear-gradient(180deg,#8ce06a,#4caf50)}
  .btn.kitchen{background:linear-gradient(180deg,#ffc266,#ff9500)}
  .btn.help{background:linear-gradient(180deg,#8fd3ff,#3d9be9);flex:0 0 auto;padding:11px 16px}

  /* ----- MODAL ----- */
  #modal{
    position:fixed;inset:0;background:rgba(50,25,10,.5);
    display:flex;align-items:center;justify-content:center;z-index:200;
    opacity:0;pointer-events:none;transition:opacity .22s;padding:14px;
    backdrop-filter:blur(3px);
  }
  #modal.show{opacity:1;pointer-events:auto}
  #modalCard{
    background:var(--cream);border-radius:26px;padding:18px 16px 16px;
    width:min(94vw,470px);max-height:86vh;overflow-y:auto;position:relative;
    border:4px solid #ffc98b;box-shadow:0 18px 50px rgba(0,0,0,.35);
    transform:scale(.88);transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    -webkit-overflow-scrolling:touch;
  }
  #modal.show #modalCard{transform:scale(1)}
  #modalClose{
    position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
    border:none;background:#ff8fab;color:#fff;font-size:16px;font-weight:900;
    cursor:pointer;box-shadow:0 3px 0 #d63e70;z-index:5;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  #modalClose:active{transform:translateY(3px);box-shadow:none}
  .modal-title{
    font-size:20px;font-weight:900;color:#e05780;margin-bottom:12px;
    text-align:center;padding-right:30px;padding-left:30px;
  }
  .modal-sub{font-size:12px;font-weight:700;color:#a9713f;text-align:center;margin:-8px 0 12px}

  /* market rows */
  .row{
    display:flex;align-items:center;gap:9px;background:#fff;
    border:2px solid #ffe3c0;border-radius:15px;padding:8px 10px;margin-bottom:8px;
    box-shadow:0 2px 0 rgba(0,0,0,.05);
  }
  .row-emoji{font-size:24px;width:32px;text-align:center;flex:0 0 auto}
  .row-info{flex:1;min-width:0}
  .row-name{font-size:14px;font-weight:900;color:#8b5e3c;line-height:1.2}
  .row-price{font-size:12px;font-weight:800;color:#2e8b57}
  .row-have{font-size:12px;font-weight:900;color:#c9a17a;white-space:nowrap}
  .mini{
    border:none;border-radius:10px;padding:7px 11px;font-family:inherit;
    font-size:12px;font-weight:900;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#8ce06a,#4caf50);
    box-shadow:0 3px 0 #35863a;transition:transform .1s,box-shadow .1s;
    white-space:nowrap;
  }
  .mini:active{transform:translateY(3px);box-shadow:none}
  .mini.b5{background:linear-gradient(180deg,#ffc266,#ff9500);box-shadow:0 3px 0 #b86a00}
  .mini:disabled{filter:grayscale(.7);opacity:.5;cursor:not-allowed}

  /* kitchen rows */
  .recipe{
    background:#fff;border:2px solid #ffe3c0;border-radius:15px;
    padding:9px 10px;margin-bottom:8px;box-shadow:0 2px 0 rgba(0,0,0,.05);
  }
  .recipe-top{display:flex;align-items:center;gap:9px}
  .recipe-emoji{font-size:26px;width:34px;text-align:center}
  .recipe-info{flex:1;min-width:0}
  .recipe-name{font-size:14px;font-weight:900;color:#8b5e3c}
  .recipe-price{font-size:12px;font-weight:800;color:#2e8b57}
  .recipe-need{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
  .need{
    font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px;
    background:#eef7e8;color:#4a8b3a;border:1.5px solid #cbe8bb;
  }
  .need.no{background:#ffe8e8;color:#d9534f;border-color:#ffc4c4}
  .make-btn{
    border:none;border-radius:12px;padding:9px 15px;font-family:inherit;
    font-size:13px;font-weight:900;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#ffc266,#ff9500);
    box-shadow:0 3px 0 #b86a00;transition:transform .1s,box-shadow .1s;
  }
  .make-btn:active{transform:translateY(3px);box-shadow:none}
  .make-btn:disabled{filter:grayscale(.8);opacity:.45;cursor:not-allowed}

  /* serve */
  .serve-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .serve-head svg{flex:0 0 auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.18))}
  .cust-name{font-size:18px;font-weight:900;color:#8b5e3c}
  .cust-sub{font-size:12px;font-weight:700;color:#c9a17a;margin-top:2px}
  .order-item{
    display:flex;align-items:center;gap:9px;background:#fff;
    border:2px solid #ffe3c0;border-radius:14px;padding:9px 12px;margin-bottom:7px;
    font-weight:900;font-size:14px;color:#8b5e3c;transition:all .25s;
  }
  .order-item.done{background:#eef7e8;border-color:#cbe8bb;color:#7aa86a;text-decoration:line-through;opacity:.75}
  .oi-emoji{font-size:20px}
  .oi-name{flex:1}
  .serve-tip{font-size:12px;font-weight:800;color:#a9713f;margin:12px 0 8px;text-align:center}
  .tray-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
  .tray-btn{
    border:2px solid #ffd6a5;background:#fff;border-radius:14px;
    padding:9px 4px;font-family:inherit;font-size:20px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    box-shadow:0 3px 0 rgba(0,0,0,.10);transition:transform .1s,box-shadow .1s;
    position:relative;
  }
  .tray-btn b{font-size:12px;color:#8b5e3c;font-weight:900}
  .tray-btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
  .tray-btn:disabled{opacity:.32;filter:grayscale(1);cursor:not-allowed}

  /* review */
  .review{text-align:center;padding:6px 0}
  .review svg{margin:0 auto;display:block;filter:drop-shadow(0 5px 7px rgba(0,0,0,.16));animation:bob 1.6s ease-in-out infinite}
  .review-name{font-size:17px;font-weight:900;color:#8b5e3c;margin-top:8px}
  .review-stars{font-size:26px;letter-spacing:2px;margin:6px 0}
  .review-text{
    font-size:14px;font-weight:800;color:#a9713f;font-style:italic;
    background:#fff;border-radius:14px;padding:11px 14px;margin:8px 0;
    border:2px dashed #ffd6a5;
  }
  .review-money{
    font-size:22px;font-weight:900;color:#2e8b57;margin:8px 0 14px;
    animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  .big-btn{
    width:100%;border:none;border-radius:16px;padding:13px;font-family:inherit;
    font-size:16px;font-weight:900;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#ff9ec4,#ff5f92);
    box-shadow:0 5px 0 #d63e70;transition:transform .1s,box-shadow .1s;
  }
  .big-btn:active{transform:translateY(4px);box-shadow:none}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);
    background:rgba(60,30,15,.92);color:#fff;font-weight:900;font-size:14px;
    padding:11px 22px;border-radius:999px;z-index:300;opacity:0;
    pointer-events:none;transition:all .3s;white-space:nowrap;
    box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:90vw;overflow:hidden;
    text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#ffd6a5;border-radius:10px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<!-- ============ INTRO ============ -->
<div id="intro">
  <div class="intro-cloud ic1"></div>
  <div class="intro-cloud ic2"></div>
  <div class="intro-cloud ic3"></div>
  <div id="introEmoji">🥖</div>
  <h1>Tiệm Bánh Mì Của Bé</h1>
  <h2>Nướng bánh • Bán cho khách • Xây dựng tiệm nhỏ xinh 🌸</h2>
  <button id="btnStart">Nhấn để bắt đầu ▶</button>
  <div class="intro-hint">Bạn có 500.000đ để khởi nghiệp • Chúc may mắn!</div>
</div>

<!-- ============ GAME ============ -->
<div id="game">

    <button id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   1. DỮ LIỆU
   ========================================================= */
const ING = {
  vo:      {name:'Vỏ bánh mì',  emoji:'🥖', price:3000},
  thit:    {name:'Thịt xá xíu', emoji:'🍖', price:8000},
  cha:     {name:'Chả lụa',     emoji:'🌭', price:6000},
  trung:   {name:'Trứng',       emoji:'🥚', price:2000},
  rau:     {name:'Rau sống',    emoji:'🥬', price:1000},
  chua:    {name:'Đồ chua',     emoji:'🥕', price:2000},
  pate:    {name:'Pate',        emoji:'🥫', price:4000},
  bo:      {name:'Bơ',          emoji:'🧈', price:4000},
  tuongot: {name:'Tương ớt',    emoji:'🌶️', price:1500}
};

const REC = {
  thit:    {name:'Bánh mì thịt',     emoji:'🥖', price:22000, w:30,
            need:{vo:1, thit:1, rau:1, chua:1, tuongot:1}},
  trung:   {name:'Bánh mì trứng',    emoji:'🍳', price:16000, w:20,
            need:{vo:1, trung:2, rau:1, tuongot:1}},
  cha:     {name:'Bánh mì chả',      emoji:'🌭', price:19000, w:20,
            need:{vo:1, cha:1, rau:1, chua:1}},
  bo:      {name:'Bánh mì bơ',       emoji:'🧈', price:13000, w:15,
            need:{vo:1, bo:1, rau:1}},
  dacbiet: {name:'Bánh mì đặc biệt', emoji:'🌟', price:38000, w:15,
            need:{vo:1, thit:1, cha:1, trung:1, rau:1, chua:1, pate:1, tuongot:1}}
};

const MALE_NAMES   = ['Bảo','Cường','Dũng','Hải','Khánh','Long','Minh','Nam','Phúc','Sơn','Tâm','Hùng','Tuấn','Vinh','Kiệt','Thắng'];
const FEMALE_NAMES = ['An','Bích','Chi','Dung','Hà','Lan','Mai','Nga','Oanh','Thu','Hoa','Linh','Trang','Yến','Nhung','Thảo'];
const SKINS  = ['#ffe0bd','#f7d0a8','#e8b98a','#d9a066','#c68642','#ffd9b3'];
const HAIRS  = ['#2b2b2b','#4a3728','#6b4423','#1a1a1a','#8b4513','#3d2b1f','#5a3a22'];
const SHIRTS = ['#ff8fab','#7ec8e3','#ffd166','#a8e6a3','#c7a2ff','#ffb07c','#8fd3ff','#ff9e9e','#b5e2a0','#f7a1c4'];

const MAX_QUEUE = 6;
const START_MONEY = 500000;

/* =========================================================
   2. ÂM THANH (nhạc tự soạn - dịu dàng, vui tươi)
   ========================================================= */
let ac = null, master = null, musicOn = false, schedTimer = null, nextTime = 0, stepIdx = 0;

const F = {
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00,
  C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880.00
};

/* Giai điệu ngũ cung C - nhẹ nhàng như dạo bước */
const MELODY = [
  'E5','G5','A5','G5','E5','D5','E5','G5',
  'D5', null,'E5','G5','E5','D5','C5','D5',
  'C5','E5','G5','A5','G5','E5','D5','E5',
  'D5','C5','D5','E5','G4','A4','C5','D5'
];
const BASS_ROOTS  = [130.81, 110.00, 87.31, 98.00];  /* C3 A2 F2 G2 */
const CHORDS = [
  [261.63, 329.63, 392.00],
  [220.00, 261.63, 329.63],
  [174.61, 220.00, 261.63],
  [196.00, 246.94, 293.66]
];

const BPM = 94;
const BEAT = 60 / BPM;
const EIGHTH = BEAT / 2;

function initAudio(){
  if(ac) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = 0.55;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 4200;
  master.connect(filter);
  filter.connect(ac.destination);
}

function tone(freq, time, dur, vol, type){
  if(!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.025);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g);
  g.connect(master);
  o.start(time);
  o.stop(time + dur + 0.06);
}

function scheduleStep(step, t){
  const n = MELODY[step % MELODY.length];
  if(n && F[n]) tone(F[n], t, 0.5, 0.055, 'triangle');

  if(step % 4 === 0){
    const bar = Math.floor(step / 8) % 4;
    tone(BASS_ROOTS[bar], t, 1.0, 0.055, 'sine');
  }
  if(step % 8 === 0){
    const ch = CHORDS[Math.floor(step / 8) % 4];
    for(let i = 0; i < ch.length; i++){
      tone(ch[i], t + i * 0.012, 1.7, 0.016, 'sine');
    }
  }
}

function scheduler(){
  if(!musicOn || !ac) return;
  while(nextTime < ac.currentTime + 0.35){
    scheduleStep(stepIdx, nextTime);
    nextTime += EIGHTH;
    stepIdx++;
  }
  schedTimer = setTimeout(scheduler, 60);
}

function startMusic(){
  initAudio();
  if(!ac) return;
  if(ac.state === 'suspended'){ ac.resume(); }
  if(musicOn) return;
  musicOn = true;
  stepIdx = 0;
  nextTime = ac.currentTime + 0.15;
  scheduler();
}

function stopMusic(){
  musicOn = false;
  if(schedTimer){ clearTimeout(schedTimer); schedTimer = null; }
}

function sfx(freq, dur, vol, type){
  if(!ac || !musicOn) return;
  tone(freq, ac.currentTime + 0.01, dur || 0.18, vol || 0.09, type || 'sine');
}

/* =========================================================
   3. TRẠNG THÁI
   ========================================================= */
const state = {
  money: START_MONEY,
  starSum: 0,
  starCount: 0,
  rep: 5.0,
  served: 0,
  inv: {},
  tray: {},
  customers: [],
  nextId: 1
};

Object.keys(ING).forEach(k => state.inv[k] = 0);
Object.keys(REC).forEach(k => state.tray[k] = 0);

/* Bộ nguyên liệu khởi đầu */
(function starterKit(){
  const kit = {vo:5, thit:3, cha:2, trung:4, rau:5, chua:4, pate:2, bo:2, tuongot:3};
  for(const k in kit) state.inv[k] = kit[k];
})();

/* =========================================================
   4. TIỆN ÍCH
   ========================================================= */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('vi-VN') + 'đ';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function weightedRecipe(){
  const keys = Object.keys(REC);
  let total = 0;
  keys.forEach(k => total += REC[k].w);
  let r = Math.random() * total;
  for(const k of keys){
    r -= REC[k].w;
    if(r <= 0) return k;
  }
  return keys[0];
}

function canMake(key){
  const need = REC[key].need;
  for(const ing in need){
    if((state.inv[ing] || 0) < need[ing]) return false;
  }
  return true;
}

/* =========================================================
   5. NHÂN VẬT SVG
   ========================================================= */
function custSVG(c, size){
  size = size || 72;
  const h = Math.round(size * 1.4);
  const hairBack = c.gender === 'nu'
    ? `<rect x="21" y="38" width="14" height="46" rx="7" fill="${c.hair}"/>
       <rect x="65" y="38" width="14" height="46" rx="7" fill="${c.hair}"/>`
    : '';
  const bow = c.gender === 'nu'
    ? `<circle cx="72" cy="30" r="5" fill="#ff8fab"/><circle cx="72" cy="30" r="2" fill="#fff"/>`
    : '';

  return `<svg viewBox="0 0 100 140" width="${size}" height="${h}" xmlns="http://www.w3.org/2000/svg">
    ${hairBack}
    <circle cx="50" cy="50" r="23" fill="${c.skin}"/>
    <path d="M26,48 A24,24 0 0 1 74,48 Q62,52 50,46 Q38,52 26,46 Z" fill="${c.hair}"/>
    ${bow}
    <ellipse cx="41" cy="52" rx="2.9" ry="3.7" fill="#3a2a20"/>
    <ellipse cx="59" cy="52" rx="2.9" ry="3.7" fill="#3a2a20"/>
    <circle cx="42" cy="50.6" r="1.15" fill="#ffffff"/>
    <circle cx="60" cy="50.6" r="1.15" fill="#ffffff"/>
    <ellipse cx="33" cy="59" rx="5" ry="3" fill="#ff9db1" opacity="0.55"/>
    <ellipse cx="67" cy="59" rx="5" ry="3" fill="#ff9db1" opacity="0.55"/>
    <path d="M45,60 Q50,65.5 55,60" stroke="#3a2a20" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M30,112 L30,86 Q30,73 50,73 Q70,73 70,86 L70,112 Z" fill="${c.shirt}"/>
    <rect x="19" y="80" width="11" height="28" rx="5.5" fill="${c.shirt}"/>
    <rect x="70" y="80" width="11" height="28" rx="5.5" fill="${c.shirt}"/>
    <circle cx="24.5" cy="109" r="5.5" fill="${c.skin}"/>
    <circle cx="75.5" cy="109" r="5.5" fill="${c.skin}"/>
    <rect x="36" y="110" width="11" height="20" rx="5" fill="#4a5568"/>
    <rect x="53" y="110" width="11" height="20" rx="5" fill="#4a5568"/>
    <ellipse cx="41.5" cy="131" rx="8" ry="4.5" fill="#2d3748"/>
    <ellipse cx="58.5" cy="131" rx="8" ry="4.5" fill="#2d3748"/>
  </svg>`;
}

/* =========================================================
   6. VÒNG QUAY NGÀY ĐÊM
   ========================================================= */
const SKY_STOPS = [
  {t:0.00, top:'#ffc2d6', bot:'#ffe9c9'},
  {t:0.18, top:'#8ecae6', bot:'#dcf4ff'},
  {t:0.45, top:'#5fb3e0', bot:'#c9ecff'},
  {t:0.70, top:'#7fb2d9', bot:'#ffe6bd'},
  {t:0.88, top:'#ff9f7a', bot:'#ffd6a5'},
  {t:1.00, top:'#ffc2d6', bot:'#ffe9c9'}
];

function hex2rgb(h){
  h = h.replace('#','');
  if(h.length === 3) h = h.split('').map(x => x + x).join('');
  return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function lerpCol(a, b, t){
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + Math.round(A[0] + (B[0]-A[0])*t) + ',' +
                  Math.round(A[1] + (B[1]-A[1])*t) + ',' +
                  Math.round(A[2] + (B[2]-A[2])*t) + ')';
}

const DAY_LENGTH = 260000; /* 260 giây cho 1 vòng */
let dayStart = 0;

function updateSky(){
  const phase = ((Date.now() - dayStart) % DAY_LENGTH) / DAY_LENGTH;
  let a = SKY_STOPS[0], b = SKY_STOPS[1];
  for(let i = 0; i < SKY_STOPS.length - 1; i++){
    if(phase >= SKY_STOPS[i].t && phase <= SKY_STOPS[i+1].t){
      a = SKY_STOPS[i]; b = SKY_STOPS[i+1];
      break;
    }
  }
  const span = (b.t - a.t) || 1;
  const k = (phase - a.t) / span;
  const top = lerpCol(a.top, b.top, k);
  const bot = lerpCol(a.bot, b.bot, k);
  $('sky').style.background = 'linear-gradient(180deg,' + top + ' 0%,' + bot + ' 100%)';

  const sunX = 6 + phase * 84;
  const sunY = 62 - Math.sin(phase * Math.PI) * 50;
  const sun = $('sun');
  sun.style.left = sunX + '%';
  sun.style.top  = sunY + '%';
  const glow = 0.35 + Math.sin(phase * Math.PI) * 0.3;
  sun.style.opacity = (0.75 + Math.sin(phase * Math.PI) * 0.25).toFixed(2);
  sun.style.boxShadow = '0 0 40px 14px rgba(255,217,61,' + glow.toFixed(2) + ')';
}

/* =========================================================
   7. HIỂN THỊ
   ========================================================= */
function renderHUD(){
  $('money').textContent = fmt(state.money);
  $('rep').textContent = state.rep.toFixed(1);
  $('served').textContent = state.served;
}

function renderTray(){
  const el = $('tray');
  const parts = [];
  Object.keys(REC).forEach(k => {
    if(state.tray[k] > 0){
      parts.push('<div class="chip"><span>' + REC[k].emoji + '</span>' +
                 REC[k].name.replace('Bánh mì ','') + ' <b>×' + state.tray[k] + '</b></div>');
    }
  });
  if(parts.length === 0){
    el.innerHTML = '<span class="tray-empty">Khay trống — vào bếp làm bánh mì nhé! 🥖</span>';
  } else {
    el.innerHTML = parts.join('');
  }
}

function renderAll(){
  renderHUD();
  renderTray();
}

/* =========================================================
   8. KHÁCH HÀNG
   ========================================================= */
function makeCustomer(){
  const gender = Math.random() < 0.5 ? 'nam' : 'nu';
  const nameList = gender === 'nam' ? MALE_NAMES : FEMALE_NAMES;
  const baseName = pick(nameList);
  let prefix;
  if(gender === 'nam'){
    prefix = Math.random() < 0.75 ? 'Anh ' : (Math.random() < 0.5 ? 'Chú ' : 'Bác ');
  } else {
    prefix = Math.random() < 0.75 ? 'Chị ' : (Math.random() < 0.5 ? 'Cô ' : 'Bà ');
  }

  const nItems = 1 + Math.floor(Math.random() * 3); /* 1 đến 3 món */
  const order = [];
  for(let i = 0; i < nItems; i++){
    order.push({key: weightedRecipe(), served: false});
  }

  return {
    id: state.nextId++,
    name: prefix + baseName,
    gender: gender,
    skin: pick(SKINS),
    hair: pick(HAIRS),
    shirt: pick(SHIRTS),
    order: order,
    arrivedAt: Date.now(),
    el: null,
    bubble: null
  };
}

function bubbleText(c){
  return c.order.map(o => REC[o.key].emoji + (o.served ? '✅' : '')).join(' ');
}

function spawnCustomer(){
  if(state.customers.length >= MAX_QUEUE) return;
  const c = makeCustomer();
  state.customers.push(c);

  const el = document.createElement('div');
  el.className = 'customer';
  el.dataset.id = c.id;
  el.innerHTML = '<div class="bubble">' + bubbleText(c) + '</div>' + custSVG(c, 74);
  c.el = el;
  c.bubble = el.querySelector('.bubble');

  $('queue').appendChild(el);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => el.classList.add('in'));
  });

  el.addEventListener('click', () => openServe(c.id));
}

function removeCustomer(id){
  const idx = state.customers.findIndex(x => x.id === id);
  if(idx === -1) return;
  const c = state.customers[idx];
  state.customers.splice(idx, 1);
  if(c.el){
    c.el.classList.remove('in');
    c.el.classList.add('out');
    const el = c.el;
    setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 500);
  }
}

let spawnTimer = null;
function scheduleSpawn(){
  clearTimeout(spawnTimer);
  const delay = rnd(5500, 11500);
  spawnTimer = setTimeout(() => {
    spawnCustomer();
    scheduleSpawn();
  }, delay);
}

/* =========================================================
   9. MODAL
   ========================================================= */
let currentModal = null;
let currentCustomerId = null;

function openModal(html, type){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('show');
  currentModal = type || null;
}
function closeModal(){
  $('modal').classList.remove('show');
  currentModal = null;
  currentCustomerId = null;
}

$('modalClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => {
  if(e.target === $('modal')) closeModal();
});

/* =========================================================
   10. CHỢ NGUYÊN LIỆU
   ========================================================= */
function openMarket(){
  const rows = Object.keys(ING).map(k => {
    const it = ING[k];
    const have = state.inv[k] || 0;
    const canBuy1 = state.money >= it.price;
    const canBuy5 = state.money >= it.price * 5;
    return `
      <div class="row">
        <div class="row-emoji">${it.emoji}</div>
        <div class="row-info">
          <div class="row-name">${it.name}</div>
          <div class="row-price">${fmt(it.price)}</div>
        </div>
        <div class="row-have">Có: ${have}</div>
        <button class="mini" data-buy="${k}" data-qty="1" ${canBuy1 ? '' : 'disabled'}>+1</button>
        <button class="mini b5" data-buy="${k}" data-qty="5" ${canBuy5 ? '' : 'disabled'}>+5</button>
      </div>`;
  }).join('');

  openModal(`
    <div class="modal-title">🛒 Chợ Nguyên Liệu</div>
    <div class="modal-sub">Túi tiền: ${fmt(state.money)}</div>
    ${rows}
  `, 'market');
}

/* =========================================================
   11. BẾP - LÀM BÁNH MÌ
   ========================================================= */
function openKitchen(){
  const rows = Object.keys(REC).map(k => {
    const r = REC[k];
    const ok = canMake(k);
    const needStr = Object.keys(r.need).map(ing => {
      const have = state.inv[ing] || 0;
      const req = r.need[ing];
      return `<span class="need ${have >= req ? '' : 'no'}">${ING[ing].emoji} ${have}/${req}</span>`;
    }).join('');

    return `
      <div class="recipe">
        <div class="recipe-top">
          <div class="recipe-emoji">${r.emoji}</div>
          <div class="recipe-info">
            <div class="recipe-name">${r.name}</div>
            <div class="recipe-price">Bán được: ${fmt(r.price)}</div>
          </div>
          <button class="make-btn" data-make="${k}" ${ok ? '' : 'disabled'}>Làm 🍳</button>
        </div>
        <div class="recipe-need">${needStr}</div>
      </div>`;
  }).join('');

  openModal(`
    <div class="modal-title">👩‍🍳 Bếp Của Bé</div>
    <div class="modal-sub">Chọn món để làm — nguyên liệu sẽ được dùng ngay</div>
    ${rows}
  `, 'kitchen');
}

function doMake(key){
  const r = REC[key];
  if(!canMake(key)){ toast('Thiếu nguyên liệu rồi! 🥲'); return; }
  for(const ing in r.need) state.inv[ing] -= r.need[ing];
  state.tray[key]++;
  sfx(880, 0.12, 0.07, 'triangle');
  setTimeout(() => sfx(1174, 0.14, 0.06, 'triangle'), 90);
  toast('Đã làm ' + r.name + '! ' + r.emoji);
  renderAll();
  if(currentModal === 'kitchen') openKitchen();
}

/* =========================================================
   12. PHỤC VỤ KHÁCH
   ========================================================= */
function waitText(ms){
  const s = Math.floor(ms / 1000);
  if(s < 60) return s + ' giây';
  return Math.floor(s / 60) + ' phút ' + (s % 60) + ' giây';
}

function openServe(id){
  const c = state.customers.find(x => x.id === id);
  if(!c){ closeModal(); return; }
  currentCustomerId = id;
  renderServe(c);
}

function renderServe(c){
  const items = c.order.map((o, i) => {
    const r = REC[o.key];
    return `<div class="order-item ${o.served ? 'done' : ''}">
      <span class="oi-emoji">${r.emoji}</span>
      <span class="oi-name">${r.name}</span>
      <span>${o.served ? '✅' : '⏳'}</span>
    </div>`;
  }).join('');

  const trayBtns = Object.keys(REC).map(k => {
    const have = state.tray[k];
    return `<button class="tray-btn" data-serve="${k}" ${have > 0 ? '' : 'disabled'}>
      <span>${REC[k].emoji}</span><b>×${have}</b>
    </button>`;
  }).join('');

  openModal(`
    <div class="modal-title" style="margin-bottom:14px">🧾 Đơn Hàng</div>
    <div class="serve-head">
      ${custSVG(c, 78)}
      <div>
        <div class="cust-name">${c.name}</div>
        <div class="cust-sub" id="waitTimer">⏳ Đã chờ: ${waitText(Date.now() - c.arrivedAt)}</div>
      </div>
    </div>
    <div>${items}</div>
    <div class="serve-tip">👇 Chọn bánh mì trong khay để phục vụ</div>
    <div class="tray-grid">${trayBtns}</div>
  `, 'serve');
}

function serveItem(recipeKey){
  const c = state.customers.find(x => x.id === currentCustomerId);
  if(!c) return;

  if(state.tray[recipeKey] <= 0){ toast('Không có bánh mì này trong khay!'); return; }

  const idx = c.order.findIndex(o => !o.served && o.key === recipeKey);
  if(idx === -1){ toast('Khách không gọi món này nha! 🤔'); return; }

  state.tray[recipeKey]--;
  c.order[idx].served = true;

  sfx(1046, 0.1, 0.07, 'sine');
  if(c.bubble) c.bubble.textContent = bubbleText(c);
  renderTray();

  if(c.order.every(o => o.served)){
    completeOrder(c);
  } else {
    renderServe(c);
  }
}

function completeOrder(c){
  const waited = Date.now() - c.arrivedAt;
  const waitedSec = waited / 1000;

  let stars = 5;
  if(waitedSec > 75) stars = 3;
  else if(waitedSec > 40) stars = 4;

  /* chút may mắn nhỏ cho tự nhiên */
  if(stars === 5 && Math.random() < 0.12) stars = 4;

  const total = c.order.reduce((s, o) => s + REC[o.key].price, 0);
  const tipRate = stars === 5 ? 0.15 : (stars === 4 ? 0.07 : 0);
  const tip = Math.round(total * tipRate / 1000) * 1000;
  const earned = total + tip;

  state.money += earned;
  state.served++;
  state.starSum += stars;
  state.starCount++;
  state.rep = state.starSum / state.starCount;

  sfx(659, 0.14, 0.09, 'sine');
  setTimeout(() => sfx(784, 0.14, 0.09, 'sine'), 110);
  setTimeout(() => sfx(1046, 0.22, 0.09, 'sine'), 220);

  const texts5 = [
    'Bánh mì ngon tuyệt vời! Mình sẽ quay lại nha! 🥰',
    'Ôi ngon quá đi mất! Chuẩn vị luôn! 😍',
    'Tuyệt cú mèo! Ăn một cái là ghiền luôn! 🌟',
    'Ngon xuất sắc! Bé làm bánh mì giỏi quá! 👏'
  ];
  const texts4 = [
    'Ngon lắm nha! Chỉ hơi lâu một xíu thôi 😋',
    'Ổn áp đó! Bánh mì giòn rụm ngon miệng!',
    'Được đó nha, lần sau mình ghé tiếp! 😊'
  ];
  const texts3 = [
    'Cũng được, nhưng mình chờ hơi lâu á 😅',
    'Tạm ổn nha, lần sau nhanh hơn chút nhé!'
  ];

  const text = stars === 5 ? pick(texts5) : stars === 4 ? pick(texts4) : pick(texts3);
  const starStr = '⭐'.repeat(stars) + '☆'.repeat(5 - stars);

  removeCustomer(c.id);
  renderAll();

  openModal(`
    <div class="review">
      <div>${custSVG(c, 86)}</div>
      <div class="review-name">${c.name}</div>
      <div class="review-stars">${starStr}</div>
      <div class="review-text">"${text}"</div>
      <div class="review-money">+ ${fmt(earned)} ${tip > 0 ? '💝' : ''}</div>
      <button class="big-btn" data-continue="1">Tiếp tục bán hàng 🥖</button>
    </div>
  `, 'review');
}

/* =========================================================
   13. SỰ KIỆN CLICK TRONG MODAL
   ========================================================= */
$('modalBody').addEventListener('click', e => {
  const buyBtn = e.target.closest('[data-buy]');
  if(buyBtn && !buyBtn.disabled){
    const k = buyBtn.dataset.buy;
    const qty = parseInt(buyBtn.dataset.qty, 10);
    const cost = ING[k].price * qty;
    if(state.money < cost){ toast('Không đủ tiền rồi! 💸'); return; }
    state.money -= cost;
    state.inv[k] = (state.inv[k] || 0) + qty;
    sfx(740, 0.1, 0.06, 'sine');
    toast('Mua ' + qty + ' ' + ING[k].name + ' (-' + fmt(cost) + ')');
    renderAll();
    openMarket();
    return;
  }

  const makeBtn = e.target.closest('[data-make]');
  if(makeBtn && !makeBtn.disabled){
    doMake(makeBtn.dataset.make);
    return;
  }

  const serveBtn = e.target.closest('[data-serve]');
  if(serveBtn && !serveBtn.disabled){
    serveItem(serveBtn.dataset.serve);
    return;
  }

  const cont = e.target.closest('[data-continue]');
  if(cont){
    closeModal();
    return;
  }
});

/* =========================================================
   14. NÚT CHÍNH
   ========================================================= */
$('btnMarket').addEventListener('click', openMarket);
$('btnKitchen').addEventListener('click', openKitchen);
$('btnHelp').addEventListener('click', () => {
  openModal(`
    <div class="modal-title">❓ Hướng Dẫn Chơi</div>
    <div style="font-size:14px;font-weight:700;color:#8b5e3c;line-height:1.9">
      <p>1️⃣ Bấm <b>🛒 Chợ</b> để mua nguyên liệu (vỏ bánh mì, thịt, trứng, rau...).</p>
      <p>2️⃣ Bấm <b>👩‍🍳 Làm bánh</b> để chế biến bánh mì — nguyên liệu sẽ được dùng.</p>
      <p>3️⃣ Khách sẽ ghé tiệm và gọi <b>1 đến 3 món</b>. Bấm vào khách để xem đơn.</p>
      <p>4️⃣ Chọn bánh mì trong khay để phục vụ. Phục vụ <b>càng nhanh</b> càng được nhiều ⭐ và tiền tip!</p>
      <p>5️⃣ Khách kiên nhẫn chờ mãi, không bao giờ bỏ đi — cứ thong thả nha 😊</p>
      <p style="margin-top:10px">💡 Mẹo: Bánh mì <b>Đặc Biệt</b> lời nhất nhưng cần nhiều nguyên liệu!</p>
    </div>
    <button class="big-btn" data-continue="1" style="margin-top:14px">Đã hiểu! 🥖</button>
  `, 'help');
});

$('btnMusic').addEventListener('click', () => {
  if(musicOn){
    stopMusic();
    $('btnMusic').textContent = '🔇';
    toast('Đã tắt nhạc 🔇');
  } else {
    startMusic();
    $('btnMusic').textContent = '🔊';
    toast('Nhạc đang phát 🎵');
  }
});

/* =========================================================
   15. BẮT ĐẦU GAME
   ========================================================= */
let gameStarted = false;

function startGame(){
  if(gameStarted) return;
  gameStarted = true;

  startMusic();
  $('btnMusic').textContent = '🔊';

  $('intro').classList.add('hide');
  $('game').classList.add('show');

  dayStart = Date.now();
  updateSky();
  renderAll();

  setTimeout(() => { spawnCustomer(); }, 1800);
  scheduleSpawn();

  setInterval(updateSky, 900);
  setInterval(() => {
    if(currentModal === 'serve' && currentCustomerId !== null){
      const c = state.customers.find(x => x.id === currentCustomerId);
      const el = $('waitTimer');
      if(c && el) el.textContent = '⏳ Đã chờ: ' + waitText(Date.now() - c.arrivedAt);
    }
  }, 1000);
}

$('btnStart').addEventListener('click', startGame);
document.addEventListener('keydown', e => {
  if(!gameStarted && (e.key === 'Enter' || e.key === ' ')) startGame();
  if(e.key === 'Escape') closeModal();
});

/* Khởi tạo sky ngay để intro không bị trống */
updateSky();

})();
</script>
